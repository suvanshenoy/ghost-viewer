# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  compile:
    cmds:
      - gleam export escript
      - mv ghost_viewer ghost-viewer

  compile:run:
    cmds:
      - task: compile
      - ./ghost-viewer {{.CLI_ARGS}}

  test:
    cmd: gleam test {{.CLI_ARGS}}

  test:watch:
    cmd: watchexec -r -c -e gleam -- task test -- {{.CLI_ARGS}}

  cleanup:
    cmds:
      - gleam clean
      - defer: rm ghost_viewer
